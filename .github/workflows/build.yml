name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dev image
        run: docker build -t tividy-dev .

      - name: Build and run tests in container
        run: docker run --rm -v "$PWD":/app -u "$(id -u):$(id -g)" tividy-dev make test