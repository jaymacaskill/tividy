name: Branch Name Check

on:
  pull_request:
    branches: [main]

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(feature|fix|docs|refactor|test|chore)/[A-Za-z0-9._-]+$ ]]; then
            echo "Branch '$BRANCH' is not allowed."
            echo "Use prefix/short-description, e.g. feature/work-item-state"
            echo "Prefixes: feature, fix, docs, refactor, test, chore"
            exit 1
          fi
          echo "Branch name OK: $BRANCH"